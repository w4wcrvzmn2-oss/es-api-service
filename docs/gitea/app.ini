; Gitea app.ini for D:\gitea (Windows)
; ROOT_URL must match the public subdomain.

APP_NAME = PharmData Git
RUN_USER =
RUN_MODE = prod

[server]
PROTOCOL = http
DOMAIN = git.24pharmdata.ru
HTTP_ADDR = 127.0.0.1
HTTP_PORT = 3000
ROOT_URL = https://git.24pharmdata.ru/
DISABLE_SSH = true
OFFLINE_MODE = false
LFS_START_SERVER = false

[database]
DB_TYPE = sqlite3
PATH = D:/gitea/data/gitea.db

[repository]
ROOT = D:/gitea/repositories

[session]
PROVIDER = memory

[log]
MODE = file
LEVEL = Info
ROOT_PATH = D:/gitea/log

[security]
INSTALL_LOCK = false
MIN_PASSWORD_LENGTH = 8

[service]
DISABLE_REGISTRATION = true
REQUIRE_SIGNIN_VIEW = false
ENABLE_NOTIFY_MAIL = false

[openid]
ENABLE_OPENID_SIGNIN = false
ENABLE_OPENID_SIGNUP = false

[api]
ENABLE_SWAGGER = false
