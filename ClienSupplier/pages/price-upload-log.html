<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статистика загрузок - Кабинет поставщика</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
    <link href="../vendor/bootstrap.min.css" rel="stylesheet">
    <link href="../vendor/simple-datatables.css" rel="stylesheet">
    <link href="../vendor/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/supplier.css">
</head>
<body class="bg-light">
    <script src="../js/auth.js"></script>
    <script>if (!AuthManager.isAuthenticated()) window.location.href = AuthManager.getLoginPath();</script>
    <script src="../js/nav-supplier.js"></script>

    <div class="container-fluid py-4 px-3 px-lg-5">
        <h1 class="mb-4"><i class="bi bi-clock-history"></i> Статистика загрузок прайсов</h1>

        <div class="card shadow-sm mb-3">
            <div class="card-body py-2">
                <div class="d-flex flex-wrap align-items-center gap-3">
                    <div class="input-group input-group-sm" style="max-width:200px">
                        <span class="input-group-text">С</span>
                        <input type="date" class="form-control" id="dateFrom">
                    </div>
                    <div class="input-group input-group-sm" style="max-width:200px">
                        <span class="input-group-text">По</span>
                        <input type="date" class="form-control" id="dateTo">
                    </div>
                    <select class="form-select form-select-sm" id="priceSelect" style="max-width:250px">
                        <option value="">Все прайс-листы</option>
                    </select>
                    <button class="btn btn-primary btn-sm" onclick="loadLog()"><i class="bi bi-search"></i> Показать</button>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table id="tblLog" class="table table-hover table-striped align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Прайс-лист</th>
                            <th>Время загрузки</th>
                            <th class="text-center">Обработано</th>
                            <th class="text-center">Формализовано</th>
                            <th class="text-center">Не формализовано</th>
                            <th class="text-center">Статус</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="6" class="empty-row">Нажмите «Показать» для загрузки данных</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../vendor/bootstrap.bundle.min.js"></script>
    <script src="../vendor/simple-datatables.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="../js/elf-table.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/toast.js"></script>
    <script>
    const STATUS_VIEW = {
        COMPLETED: '<span class="badge bg-success">OK</span>',
        FAILED: '<span class="badge bg-danger">Ошибка</span>',
        PROCESSING: '<span class="badge bg-warning text-dark">В обработке</span>'
    };
    let dt = null;

    (async function() {
        const priceLists = await API.get('/api/sc/price-lists');
        const sel = document.getElementById('priceSelect');
        if (priceLists) {
            priceLists.forEach(pl => {
                const opt = document.createElement('option');
                opt.value = pl.price_list_id;
                opt.textContent = pl.name;
                sel.appendChild(opt);
            });
        }
        const d = new Date();
        document.getElementById('dateTo').value = d.toISOString().split('T')[0];
        d.setMonth(d.getMonth() - 1);
        document.getElementById('dateFrom').value = d.toISOString().split('T')[0];
    })();

    async function loadLog() {
        if (dt) { ElfTable.destroy(dt); dt = null; }
        const tbody = document.querySelector('#tblLog tbody');
        tbody.innerHTML = '<tr><td colspan="6" class="loading">Загрузка...</td></tr>';
        const dateFrom = document.getElementById('dateFrom').value;
        const dateTo = document.getElementById('dateTo').value;
        const priceId = document.getElementById('priceSelect').value;
        let q = '/api/sc/price-upload-log?date_from=' + dateFrom + '&date_to=' + dateTo;
        if (priceId) q += '&price_list_id=' + priceId;
        const data = await API.get(q);
        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="empty-row">Нет записей за указанный период</td></tr>';
            return;
        }
        tbody.innerHTML = data.map(r => `
            <tr>
                <td>${escapeHtml(r.price_name || '')}</td>
                <td>${formatDateTime(r.download_time)}</td>
                <td class="text-center">${r.records_processed}</td>
                <td class="text-center text-success">${r.formalized_count}</td>
                <td class="text-center text-warning">${r.unformalized_count}</td>
                <td class="text-center">${formatStatus(r.status)}</td>
            </tr>
        `).join('');
        dt = ElfTable.init('tblLog', { exportName: 'Статистика_загрузок', unsortable: [5] });
    }

    function formatDateTime(value) {
        if (!value) return '—';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return escapeHtml(value);
        return date.toLocaleString('ru-RU');
    }

    function formatStatus(status) {
        return STATUS_VIEW[status] || `<span class="badge bg-secondary">${escapeHtml(status || '—')}</span>`;
    }
    </script>
</body>
</html>
