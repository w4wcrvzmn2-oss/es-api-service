<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обслуживание заказов - Кабинет поставщика</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/supplier.css">
</head>
<body class="bg-light">
    <script src="../js/auth.js"></script>
    <script>if (!AuthManager.isAuthenticated()) window.location.href = AuthManager.getLoginPath();</script>
    <script src="../js/nav-supplier.js"></script>

    <div class="container-fluid py-4 px-3 px-lg-5">
        <h1 class="mb-4"><i class="bi bi-gear"></i> Обслуживание заказов</h1>

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white">
                <h5 class="mb-0">Минимальные суммы по прайс-листам</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped mb-0" id="tblService">
                        <thead>
                            <tr>
                                <th>Прайс-лист</th>
                                <th>Регион</th>
                                <th class="text-end">Мин. заказ</th>
                                <th class="text-end">Мин. дозаказ</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td colspan="4" class="loading">Загрузка...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h5 class="mb-0">Расписание дозаказов</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped mb-0" id="tblSchedule">
                        <thead>
                            <tr>
                                <th>Регион</th>
                                <th>Пн</th><th>Вт</th><th>Ср</th><th>Чт</th><th>Пт</th><th>Сб</th><th>Вс</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td colspan="8" class="loading">Загрузка...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/toast.js"></script>
    <script>
    async function loadServiceSettings() {
        const data = await API.get('/api/sc/order-service');
        const tbody = document.querySelector('#tblService tbody');
        const tbody2 = document.querySelector('#tblSchedule tbody');

        if (!data) {
            tbody.innerHTML = '<tr><td colspan="4" class="empty-row">Нет данных</td></tr>';
            tbody2.innerHTML = '<tr><td colspan="8" class="empty-row">Нет данных</td></tr>';
            return;
        }

        if (data.min_amounts && data.min_amounts.length > 0) {
            tbody.innerHTML = data.min_amounts.map(r => `
                <tr>
                    <td>${escapeHtml(r.price_name || '')}</td>
                    <td>${escapeHtml(r.region_name || '')}</td>
                    <td class="text-end">${(r.min_order || 0).toLocaleString('ru-RU')} ₽</td>
                    <td class="text-end">${(r.min_reorder || 0).toLocaleString('ru-RU')} ₽</td>
                </tr>
            `).join('');
        } else {
            tbody.innerHTML = '<tr><td colspan="4" class="empty-row">Нет настроек</td></tr>';
        }

        if (data.schedule && data.schedule.length > 0) {
            tbody2.innerHTML = data.schedule.map(r => `
                <tr>
                    <td>${escapeHtml(r.region_name || '')}</td>
                    <td>${r.mon || '—'}</td><td>${r.tue || '—'}</td><td>${r.wed || '—'}</td>
                    <td>${r.thu || '—'}</td><td>${r.fri || '—'}</td><td>${r.sat || '—'}</td><td>${r.sun || '—'}</td>
                </tr>
            `).join('');
        } else {
            tbody2.innerHTML = '<tr><td colspan="8" class="empty-row">Нет расписания</td></tr>';
        }
    }

    loadServiceSettings();
    </script>
</body>
</html>
