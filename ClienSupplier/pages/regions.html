<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регионы - Кабинет поставщика</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
    <link href="../vendor/bootstrap.min.css" rel="stylesheet">
    <link href="../vendor/simple-datatables.css" rel="stylesheet">
    <link href="../vendor/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/supplier.css">
</head>
<body class="bg-light">
    <script src="../js/auth.js"></script>
    <script>if (!AuthManager.isAuthenticated()) window.location.href = AuthManager.getLoginPath();</script>
    <script src="../js/nav-supplier.js"></script>

    <div class="container-fluid py-4 px-3 px-lg-5">
        <h1 class="mb-4"><i class="bi bi-geo-alt"></i> Регионы</h1>
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table id="tblRegions" class="table table-hover table-striped align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Регион</th>
                            <th class="text-center">Статус</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="2" class="loading">Загрузка...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../vendor/bootstrap.bundle.min.js"></script>
    <script src="../vendor/simple-datatables.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="../js/elf-table.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/toast.js"></script>
    <script>
    async function loadRegions() {
        const data = await API.get('/api/sc/regions');
        const tbody = document.querySelector('#tblRegions tbody');
        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="2" class="empty-row">Нет регионов</td></tr>';
            return;
        }
        tbody.innerHTML = data.map(r => {
            const cls = r.is_active ? 'bg-success' : 'bg-secondary';
            const txt = r.is_active ? 'Активен' : 'Неактивен';
            return `<tr>
                <td><i class="bi bi-geo-alt text-muted me-1"></i>${escapeHtml(r.name)}</td>
                <td class="text-center">
                    <span class="badge ${cls}" style="cursor:pointer"
                          onclick="toggleRegion('${r.supplier_region_id}', ${!r.is_active}, this)">${txt}</span>
                </td>
            </tr>`;
        }).join('');
        ElfTable.init('tblRegions', { exportName: 'Регионы', unsortable: [1] });
    }

    async function toggleRegion(id, newState, el) {
        const res = await API.patch('/api/sc/regions?id=' + id, { is_active: newState });
        if (res && res.status === 'ok') {
            el.className = 'badge ' + (newState ? 'bg-success' : 'bg-secondary');
            el.textContent = newState ? 'Активен' : 'Неактивен';
            el.setAttribute('onclick', `toggleRegion('${id}', ${!newState}, this)`);
        }
    }
    loadRegions();
    </script>
</body>
</html>
