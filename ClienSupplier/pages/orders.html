<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказы - Кабинет поставщика</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%232e8a57'/><rect x='42' y='22' width='16' height='56' rx='5' fill='%23fff'/><rect x='22' y='42' width='56' height='16' rx='5' fill='%23fff'/></svg>">
    <link href="../vendor/bootstrap.min.css" rel="stylesheet">
    <link href="../vendor/simple-datatables.css" rel="stylesheet">
    <link href="../vendor/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/supplier.css">
</head>
<body class="bg-light">
    <script src="../js/auth.js"></script>
    <script>if (!AuthManager.isAuthenticated()) window.location.href = AuthManager.getLoginPath();</script>
    <script src="../js/nav-supplier.js"></script>

    <div class="container-fluid py-4 px-3 px-lg-5">
        <h1 class="mb-4"><i class="bi bi-cart3"></i> Статистика заказов</h1>

        <div class="card shadow-sm mb-3">
            <div class="card-body py-2">
                <div class="d-flex flex-wrap align-items-center gap-3">
                    <div class="input-group input-group-sm" style="max-width:200px">
                        <span class="input-group-text">С</span>
                        <input type="date" class="form-control" id="dateFrom">
                    </div>
                    <div class="input-group input-group-sm" style="max-width:200px">
                        <span class="input-group-text">По</span>
                        <input type="date" class="form-control" id="dateTo">
                    </div>
                    <div class="input-group input-group-sm" style="max-width:280px">
                        <input type="text" class="form-control" id="searchInput" placeholder="Поиск по клиенту, адресу...">
                        <button class="btn btn-primary" onclick="loadOrders()"><i class="bi bi-search"></i></button>
                    </div>
                    <button class="btn btn-success btn-sm" id="btnExport" onclick="exportOrders()" title="Сформировать DBF и отправить по настройкам выгрузки">
                        <i class="bi bi-upload"></i> Выгрузить
                    </button>
                    <a class="btn btn-outline-secondary btn-sm" href="order-export.html" title="Настройки FTP / почты">
                        <i class="bi bi-gear"></i>
                    </a>
                    <span class="text-muted ms-auto" id="totalInfo"></span>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle mb-0" id="tblOrders">
                        <thead>
                            <tr>
                                <th>№</th>
                                <th>Дата</th>
                                <th>Клиент</th>
                                <th>Адрес доставки</th>
                                <th class="text-center">Позиций</th>
                                <th class="text-end">Сумма</th>
                                <th class="text-center">Статус</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td colspan="7" class="loading">Загрузка...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="../vendor/bootstrap.bundle.min.js"></script>
    <script src="../vendor/simple-datatables.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="../js/elf-table.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/toast.js"></script>
    <script>
    let dt = null;

    (function() {
        const d = new Date();
        document.getElementById('dateTo').value = d.toISOString().split('T')[0];
        d.setMonth(d.getMonth() - 1);
        document.getElementById('dateFrom').value = d.toISOString().split('T')[0];
        loadOrders();
    })();

    async function loadOrders() {
        if (dt) { ElfTable.destroy(dt); dt = null; }
        const tbody = document.querySelector('#tblOrders tbody');
        tbody.innerHTML = '<tr><td colspan="7" class="loading">Загрузка...</td></tr>';

        const dateFrom = document.getElementById('dateFrom').value;
        const dateTo = document.getElementById('dateTo').value;
        const search = document.getElementById('searchInput').value;

        let q = '/api/sc/orders?page=1&per_page=5000&date_from=' + dateFrom + '&date_to=' + dateTo;
        if (search) q += '&search=' + encodeURIComponent(search);

        const data = await API.get(q);
        if (!data || !data.items || data.items.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="empty-row">Нет заказов за указанный период</td></tr>';
            document.getElementById('totalInfo').textContent = '';
            return;
        }

        document.getElementById('totalInfo').textContent = 'Всего: ' + data.total;
        tbody.innerHTML = data.items.map(o => `
            <tr>
                <td>${escapeHtml(o.order_id)}</td>
                <td>${new Date(o.order_date).toLocaleDateString('ru-RU')}</td>
                <td>${escapeHtml(o.buyer_name)}</td>
                <td>${escapeHtml(o.delivery_address)}</td>
                <td class="text-center">${o.total_items}</td>
                <td class="text-end">${formatMoney(o.total_amount)} ₽</td>
                <td class="text-center"><span class="badge bg-secondary">${escapeHtml(o.status_name || 'N/A')}</span></td>
            </tr>
        `).join('');

        dt = ElfTable.init('tblOrders', { exportName: 'Заказы', sortColumn: 1, sortDir: 'desc' });
    }

    function formatMoney(value) {
        const n = Number(value);
        return Number.isFinite(n) ? n.toLocaleString('ru-RU', {minimumFractionDigits:2}) : '0,00';
    }

    function downloadBase64(fileName, b64) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const blob = new Blob([bytes], { type: 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName || 'orders.dbf';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
    }

    async function exportOrders() {
        const btn = document.getElementById('btnExport');
        const dateFrom = document.getElementById('dateFrom').value;
        const dateTo = document.getElementById('dateTo').value;
        btn.disabled = true;
        const oldHtml = btn.innerHTML;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Выгрузка...';
        try {
            const q = '/api/sc/orders/export?date_from=' + encodeURIComponent(dateFrom) +
                      '&date_to=' + encodeURIComponent(dateTo);
            const data = await API.post(q, {});
            if (!data || !data.file_base64) throw new Error('Пустой ответ сервера');
            downloadBase64(data.file_name, data.file_base64);

            const ftp = (data.ftp && data.ftp.status) || 'skip';
            const email = (data.email && data.email.status) || 'skip';
            let detail = 'Заказов: ' + (data.orders_count || 0) + ', строк: ' + (data.lines_count || 0);
            if (ftp === 'ok') detail += '; FTP: ок';
            if (ftp === 'error') detail += '; FTP: ошибка — ' + (data.ftp.error || '');
            if (email === 'ok') detail += '; почта: ок';
            if (email === 'error') detail += '; почта: ошибка — ' + (data.email.error || '');
            if (ftp === 'skip' && email === 'skip') {
                detail += '. Отправка не настроена — только скачивание (раздел «Выгрузка заказов»).';
            }
            if (window.Toast && Toast.success) Toast.success('Выгрузка готова', detail);
            else alert(detail);
        } catch (e) {
            if (window.Toast && Toast.error) Toast.error('Ошибка выгрузки', e.message || String(e));
            else alert('Ошибка выгрузки: ' + (e.message || e));
        } finally {
            btn.disabled = false;
            btn.innerHTML = oldHtml;
        }
    }
    </script>
</body>
</html>
