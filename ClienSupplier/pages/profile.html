<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль - Кабинет поставщика</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
    <link href="../vendor/bootstrap.min.css" rel="stylesheet">
    <link href="../vendor/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/supplier.css">
</head>
<body class="bg-light">
    <script src="../js/auth.js"></script>
    <script>if (!AuthManager.isAuthenticated()) window.location.href = AuthManager.getLoginPath();</script>
    <script src="../js/nav-supplier.js"></script>

    <div class="container-fluid py-4 px-3 px-lg-5">
        <h1 class="mb-4"><i class="bi bi-person-vcard"></i> Контактная информация</h1>

        <div class="card shadow-sm" style="max-width: 700px;">
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Наименование</label>
                    <input type="text" class="form-control" id="fldName" readonly disabled>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">ИНН</label>
                    <input type="text" class="form-control" id="fldINN" readonly disabled>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Номер договора</label>
                    <input type="text" class="form-control" id="fldContract" readonly disabled>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Адрес</label>
                    <input type="text" class="form-control" id="fldAddress" readonly disabled>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Контакты</label>
                    <input type="text" class="form-control" id="fldContacts" readonly disabled>
                </div>
                <hr>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Адрес доставки <span class="text-muted fw-normal">(редактируемый)</span></label>
                    <textarea class="form-control" id="fldDeliveryAddress" rows="2"></textarea>
                </div>
                <button class="btn btn-primary" id="btnSave" onclick="saveProfile()">
                    <i class="bi bi-check-lg"></i> Сохранить
                </button>
            </div>
        </div>
    </div>

    <script src="../vendor/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/toast.js"></script>
    <script>
    async function loadProfile() {
        const data = await API.get('/api/sc/profile');
        if (!data) return;
        document.getElementById('fldName').value = data.name || '';
        document.getElementById('fldINN').value = data.inn || '';
        document.getElementById('fldContract').value = data.contract_number || '';
        document.getElementById('fldAddress').value = data.address || '';
        document.getElementById('fldContacts').value = data.contacts || '';
        document.getElementById('fldDeliveryAddress').value = data.delivery_address || '';
    }

    async function saveProfile() {
        const btn = document.getElementById('btnSave');
        btn.disabled = true;
        try {
            await API.put('/api/sc/profile', {
                delivery_address: document.getElementById('fldDeliveryAddress').value
            });
            Toast.success('Сохранено', 'Адрес доставки обновлён');
        } catch(e) {
            Toast.error('Ошибка', e.message);
        } finally {
            btn.disabled = false;
        }
    }

    loadProfile();
    </script>
</body>
</html>
