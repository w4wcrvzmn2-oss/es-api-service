<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Позиции прайса - Кабинет поставщика</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%232e8a57'/><rect x='42' y='22' width='16' height='56' rx='5' fill='%23fff'/><rect x='22' y='42' width='56' height='16' rx='5' fill='%23fff'/></svg>">
    <link href="../vendor/bootstrap.min.css" rel="stylesheet">
    <link href="../vendor/simple-datatables.css" rel="stylesheet">
    <link href="../vendor/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/supplier.css">
</head>
<body class="bg-light">
    <script src="../js/auth.js"></script>
    <script>if (!AuthManager.isAuthenticated()) window.location.href = AuthManager.getLoginPath();</script>
    <script src="../js/nav-supplier.js"></script>

    <div class="container-fluid py-4 px-3 px-lg-5">
        <div class="d-flex align-items-center gap-3 mb-4">
            <a href="price-lists.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i></a>
            <h1 class="mb-0"><i class="bi bi-card-list"></i> Позиции прайса: <span id="priceName" class="text-muted"></span></h1>
        </div>

        <div class="card shadow-sm mb-3">
            <div class="card-body py-2">
                <div class="d-flex flex-wrap align-items-center gap-3">
                    <div class="btn-group btn-group-sm" role="group">
                        <button type="button" class="btn btn-outline-secondary active" onclick="setFilter('all',this)">Все</button>
                        <button type="button" class="btn btn-outline-success" onclick="setFilter('formalized',this)">Формализованные</button>
                        <button type="button" class="btn btn-outline-warning" onclick="setFilter('unformalized',this)">Не формализованные</button>
                    </div>
                    <span class="text-muted ms-auto" id="totalInfo"></span>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table id="tblPositions" class="table table-hover table-striped align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Наименование из прайса</th>
                            <th>Производитель</th>
                            <th>Наименование в системе</th>
                            <th class="text-end">Цена</th>
                            <th class="text-end">Цена с наценкой</th>
                            <th class="text-end">Кол-во</th>
                            <th class="text-center">Статус</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="7" class="loading">Загрузка...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../vendor/bootstrap.bundle.min.js"></script>
    <script src="../vendor/simple-datatables.js"></script>
    <script src="../js/elf-table.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/toast.js"></script>
    <script>
    const params = new URLSearchParams(location.search);
    const priceListId = params.get('price_list_id');
    document.getElementById('priceName').textContent = decodeURIComponent(params.get('name') || '');

    let currentFilter = 'all';
    let dt = null;

    function setFilter(f, btn) {
        currentFilter = f;
        document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadPositions();
    }

    async function loadPositions() {
        if (dt) { ElfTable.destroy(dt); dt = null; }
        const tbody = document.querySelector('#tblPositions tbody');
        tbody.innerHTML = '<tr><td colspan="7" class="loading">Загрузка...</td></tr>';

        const q = '/api/sc/price-positions?price_list_id=' + priceListId +
                  '&filter=' + currentFilter + '&page=1&per_page=100000';

        const data = await API.get(q);
        if (!data || !data.items || data.items.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="empty-row">Нет позиций</td></tr>';
            document.getElementById('totalInfo').textContent = '';
            return;
        }
        document.getElementById('totalInfo').textContent = 'Всего: ' + data.total;
        tbody.innerHTML = data.items.map(p => {
            const badge = p.guid_es
                ? '<span class="badge bg-success">Формализован</span>'
                : '<span class="badge bg-warning">Не формализован</span>';
            return '<tr>' +
                '<td>' + escapeHtml(p.item_name) + '</td>' +
                '<td>' + escapeHtml(p.manufacturer || '') + '</td>' +
                '<td>' + escapeHtml(p.product_name || '—') + '</td>' +
                '<td class="text-end">' + formatNumber(p.price, 2) + '</td>' +
                '<td class="text-end">' + formatNumber(p.final_price, 2) + '</td>' +
                '<td class="text-end">' + p.quantity + '</td>' +
                '<td class="text-center">' + badge + '</td>' +
                '</tr>';
        }).join('');

        dt = ElfTable.init('tblPositions', { exportName: 'Позиции_прайса', unsortable: [6] });
    }

    if (priceListId) loadPositions();
    else document.querySelector('#tblPositions tbody').innerHTML = '<tr><td colspan="7" class="empty-row">Выберите прайс-лист</td></tr>';

    function formatNumber(value, digits) {
        const n = Number(value);
        return Number.isFinite(n) ? n.toFixed(digits) : (0).toFixed(digits);
    }
    </script>
</body>
</html>
