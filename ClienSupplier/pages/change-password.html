<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Смена пароля - Кабинет поставщика</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%232e8a57'/><rect x='42' y='22' width='16' height='56' rx='5' fill='%23fff'/><rect x='22' y='42' width='56' height='16' rx='5' fill='%23fff'/></svg>">
    <link href="../vendor/bootstrap.min.css" rel="stylesheet">
    <link href="../vendor/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/supplier.css">
</head>
<body class="bg-light">
    <script src="../js/auth.js"></script>
    <script>if (!AuthManager.isAuthenticated()) window.location.href = AuthManager.getLoginPath();</script>
    <script src="../js/nav-supplier.js"></script>

    <div class="container-fluid py-4 px-3 px-lg-5">
        <h1 class="mb-4"><i class="bi bi-key"></i> Смена пароля</h1>
        <div class="card shadow-sm" style="max-width:500px">
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label fw-bold">Текущий пароль</label>
                    <input type="password" class="form-control" id="oldPwd">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Новый пароль</label>
                    <input type="password" class="form-control" id="newPwd">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Подтверждение пароля</label>
                    <input type="password" class="form-control" id="confirmPwd">
                </div>
                <button class="btn btn-success" id="btnChange"><i class="bi bi-check-lg"></i> Сменить пароль</button>
            </div>
        </div>
    </div>

    <script src="../vendor/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/toast.js"></script>
    <script>
    document.getElementById('btnChange').addEventListener('click', async () => {
        const oldPwd = document.getElementById('oldPwd').value;
        const newPwd = document.getElementById('newPwd').value;
        const confirmPwd = document.getElementById('confirmPwd').value;
        if (!oldPwd || !newPwd) { Toast.warning('Внимание', 'Заполните все поля'); return; }
        if (newPwd !== confirmPwd) { Toast.warning('Внимание', 'Пароли не совпадают'); return; }
        if (newPwd.length < 4) { Toast.warning('Внимание', 'Пароль должен быть не менее 4 символов'); return; }
        try {
            await API.put('/api/sc/change-password', { old_password: oldPwd, new_password: newPwd });
            Toast.success('Готово', 'Пароль успешно изменён');
            document.getElementById('oldPwd').value = '';
            document.getElementById('newPwd').value = '';
            document.getElementById('confirmPwd').value = '';
        } catch(e) {
            Toast.error('Ошибка', e.message);
        }
    });
    </script>
</body>
</html>
