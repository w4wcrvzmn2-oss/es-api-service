<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - PharmData</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%232b6cab'/><rect x='42' y='22' width='16' height='56' rx='5' fill='%23fff'/><rect x='22' y='42' width='56' height='16' rx='5' fill='%23fff'/></svg>">
    <link href="vendor/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body>
    <div class="login-page">
        <div class="card shadow-lg border-0" style="max-width:420px;width:100%">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <span style="font-size:3rem">💊</span>
                    <h1 class="h3 mt-2" style="color:#31528f">PharmData</h1>
                    <p class="text-muted">Система управления прайсами и заказами</p>
                </div>

                <div id="errorMessage" class="alert alert-danger d-none"></div>

                <form id="loginForm">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="username" placeholder="Логин" required autocomplete="username">
                        <label for="username">Логин</label>
                    </div>
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="password" placeholder="Пароль" required autocomplete="current-password">
                        <label for="password">Пароль</label>
                    </div>
                    <button type="submit" class="login-btn w-100 py-2" id="loginBtn">Войти</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function getApiBase() {
            if (window.location && window.location.origin) {
                const o = window.location.origin;
                if (o && o !== 'null' && !o.startsWith('file://')) return o;
            }
            return 'http://localhost:8082';
        }
        const API_BASE = getApiBase();

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const errEl = document.getElementById('errorMessage');

            loginBtn.disabled = true;
            loginBtn.textContent = 'Вход...';
            errEl.classList.add('d-none');

            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                    mode: 'cors', credentials: 'omit'
                });
                const data = await response.json();
                if (response.ok && data.token) {
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('userInfo', JSON.stringify({ username, role: data.role }));
                    if (data.role === 'supplier') {
                        window.location.href = '/supplier/index.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                } else {
                    throw new Error(data.error || 'Неверный логин или пароль');
                }
            } catch (error) {
                errEl.textContent = error.message || 'Ошибка подключения к серверу';
                errEl.classList.remove('d-none');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Войти';
            }
        });

        if (localStorage.getItem('authToken')) {
            const info = JSON.parse(localStorage.getItem('userInfo') || '{}');
            if (info.role === 'supplier') {
                window.location.href = '/supplier/index.html';
            } else {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
