<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование покупателя - PharmData</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%232b6cab'/><rect x='42' y='22' width='16' height='56' rx='5' fill='%23fff'/><rect x='22' y='42' width='56' height='16' rx='5' fill='%23fff'/></svg>">
    <link href="../vendor/bootstrap.min.css" rel="stylesheet">
    <link href="../vendor/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/custom.css">
</head>
<body class="bg-light">
    <script src="../js/auth.js"></script>
    <script>if (!AuthManager.isAuthenticated()) window.location.href = '../login.html';</script>
    <script src="../js/nav-component.js"></script>

    <div class="container-fluid py-4 px-3 px-lg-5" style="max-width:900px">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="mb-0" id="pageTitle">Создание покупателя</h1>
            <button class="btn btn-outline-secondary" onclick="location.href='buyers.html'"><i class="bi bi-arrow-left"></i> Назад</button>
        </div>

        <div class="card shadow-sm">
            <div class="card-header"><h5 class="mb-0">Покупатель</h5></div>
            <div class="card-body">
                <form id="buyerForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="name" class="form-label">Название *</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="col-md-6">
                            <label for="inn" class="form-label">ИНН</label>
                            <input type="text" class="form-control" id="inn" name="inn">
                        </div>
                    </div>
                    <div class="row g-3 mt-0">
                        <div class="col-md-4">
                            <label for="code" class="form-label">Код клиента</label>
                            <input type="text" class="form-control" id="code" name="code">
                        </div>
                        <div class="col-md-4">
                            <label for="phone" class="form-label">Телефон</label>
                            <input type="tel" inputmode="tel" class="form-control" id="phone" name="phone"
                                   placeholder="+7 (___) ___-__-__" autocomplete="tel" maxlength="18">
                        </div>
                        <div class="col-md-4">
                            <label for="email" class="form-label">Почта</label>
                            <input type="email" class="form-control" id="email" name="email">
                        </div>
                    </div>
                    <div class="mb-3 mt-3">
                        <label for="address" class="form-label">Адрес клиента</label>
                        <input type="text" class="form-control" id="address" name="address">
                    </div>
                    <div class="mb-3 mt-3">
                        <label for="regionSelect" class="form-label">Регион</label>
                        <select class="form-select" id="regionSelect" name="regionSelect">
                            <option value="">Выберите регион</option>
                        </select>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="isActive" name="isActive" checked>
                        <label class="form-check-label" for="isActive">Активен</label>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success"><i class="bi bi-check-lg"></i> Сохранить</button>
                        <button type="button" class="btn btn-outline-secondary" onclick="location.href='buyers.html'">Отмена</button>
                        <button type="button" class="btn btn-danger" onclick="deleteBuyer()" id="deleteBtn" style="display:none">
                            <i class="bi bi-trash"></i> УДАЛИТЬ
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Личный кабинет покупателя (логин + пароль) -->
        <div class="card shadow-sm mt-4" id="accountCard">
            <div class="card-header"><h5 class="mb-0">Личный кабинет покупателя (вход)</h5></div>
            <div class="card-body">
                <div id="accountExisting" class="mb-3" style="display:none"></div>
                <p class="text-muted small mb-3" id="accountHint">
                    Заполните логин и пароль — при сохранении будет создан личный кабинет покупателя.
                    Вход выполняется по этому e-mail и паролю.
                </p>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="loginEmail" class="form-label">Логин (e-mail для входа)</label>
                        <input type="email" class="form-control" id="loginEmail" autocomplete="off">
                    </div>
                    <div class="col-md-6">
                        <label for="loginPassword" class="form-label">Пароль</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="loginPassword" autocomplete="new-password">
                            <button type="button" class="btn btn-outline-secondary" onclick="genPassword()" title="Сгенерировать"><i class="bi bi-shuffle"></i></button>
                            <button type="button" class="btn btn-outline-secondary" onclick="togglePwd()" title="Показать/скрыть"><i class="bi bi-eye" id="togglePwdIcon"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Точки доставки (Location ID) — видны в режиме редактирования -->
        <div class="card shadow-sm mt-4" id="locationsCard" style="display:none">
            <div class="card-header d-flex align-items-center justify-content-between">
                <h5 class="mb-0">Точки доставки (Location ID)</h5>
                <span class="text-muted small">Location ID нужен для десктоп-клиента</span>
            </div>
            <div class="card-body">
                <div id="locationsList" class="mb-3"><div class="text-muted">Загрузка...</div></div>
                <div class="row g-2 align-items-end">
                    <div class="col-md-5">
                        <label for="locAddress" class="form-label">Адрес точки</label>
                        <input type="text" class="form-control" id="locAddress">
                    </div>
                    <div class="col-md-3">
                        <label for="locRegion" class="form-label">Регион</label>
                        <select class="form-select" id="locRegion"><option value="">—</option></select>
                    </div>
                    <div class="col-md-2">
                        <div class="form-check mt-4">
                            <input class="form-check-input" type="checkbox" id="locDefault">
                            <label class="form-check-label" for="locDefault">По умолч.</label>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <button type="button" class="btn btn-primary w-100" onclick="addLocation()"><i class="bi bi-plus-lg"></i> Добавить</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../vendor/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/buyer-edit.js"></script>
</body>
</html>
