<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование покупателя - ЭльФиСА</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💊</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/custom.css">
</head>
<body class="bg-light">
    <script src="../js/auth.js"></script>
    <script>if (!AuthManager.isAuthenticated()) window.location.href = '../login.html';</script>
    <script src="../js/nav-component.js"></script>

    <div class="container-fluid py-4 px-3 px-lg-5" style="max-width:900px">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="mb-0" id="pageTitle">Создание покупателя</h1>
            <button class="btn btn-outline-secondary" onclick="location.href='buyers.html'"><i class="bi bi-arrow-left"></i> Назад</button>
        </div>

        <div class="card shadow-sm">
            <div class="card-header"><h5 class="mb-0">Покупатель</h5></div>
            <div class="card-body">
                <form id="buyerForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="name" class="form-label">Название *</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="col-md-6">
                            <label for="inn" class="form-label">ИНН</label>
                            <input type="text" class="form-control" id="inn" name="inn">
                        </div>
                    </div>
                    <div class="mb-3 mt-3">
                        <label for="regionSelect" class="form-label">Регион</label>
                        <select class="form-select" id="regionSelect" name="regionSelect">
                            <option value="">Выберите регион</option>
                        </select>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="isActive" name="isActive" checked>
                        <label class="form-check-label" for="isActive">Активен</label>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success"><i class="bi bi-check-lg"></i> Сохранить</button>
                        <button type="button" class="btn btn-outline-secondary" onclick="location.href='buyers.html'">Отмена</button>
                        <button type="button" class="btn btn-danger" onclick="deleteBuyer()" id="deleteBtn" style="display:none">
                            <i class="bi bi-trash"></i> УДАЛИТЬ
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/buyer-edit.js"></script>
</body>
</html>
