<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прайсы - ЭльФиСА</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💊</text></svg>">
    <link href="../vendor/bootstrap.min.css" rel="stylesheet">
    <link href="../vendor/simple-datatables.css" rel="stylesheet">
    <link href="../vendor/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/custom.css">
</head>
<body class="bg-light">
    <script src="../js/auth.js"></script>
    <script>if (!AuthManager.isAuthenticated()) window.location.href = '../login.html';</script>
    <script src="../js/nav-component.js"></script>

    <div class="container-fluid py-4 px-3 px-lg-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="mb-0">Прайсы</h1>
            <button class="btn btn-success" onclick="location.href='price-edit.html'"><i class="bi bi-plus-lg"></i> Добавить</button>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table id="tblPriceLists" class="table table-hover table-striped align-middle mb-0">
                        <thead>
                            <tr>
                                <th style="width:60px" data-no-filter>Акт.</th>
                                <th>Наименование</th>
                                <th>Поставщик</th>
                                <th>Посл.обнов.</th>
                                <th style="width:80px" data-no-filter>Позиций</th>
                                <th style="width:120px" data-no-filter>Действия</th>
                                <th style="width:60px" data-no-filter></th>
                                <th style="width:110px" data-no-filter>Нет связи</th>
                            </tr>
                        </thead>
                        <tbody id="priceListsTable">
                            <tr><td colspan="8" class="text-center text-muted py-3">Загрузка данных...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="../vendor/bootstrap.bundle.min.js"></script>
    <script src="../vendor/simple-datatables.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="../js/elf-table.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/table-filters.js?v=6"></script>
    <script src="../js/price-lists.js?v=8"></script>
</body>
</html>
