<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование точки доступа - PharmData</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%232b6cab'/><rect x='42' y='22' width='16' height='56' rx='5' fill='%23fff'/><rect x='22' y='42' width='56' height='16' rx='5' fill='%23fff'/></svg>">
    <link href="../vendor/bootstrap.min.css" rel="stylesheet">
    <link href="../vendor/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/custom.css">
</head>
<body class="bg-light">
    <script src="../js/auth.js"></script>
    <script>if (!AuthManager.isAuthenticated()) window.location.href = '../login.html';</script>
    <script src="../js/nav-component.js"></script>

    <div class="container-fluid py-4 px-3 px-lg-5" style="max-width:900px">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="mb-0" id="pageTitle">Создание точки доступа</h1>
            <button class="btn btn-outline-secondary" onclick="location.href='access-points.html'"><i class="bi bi-arrow-left"></i> Назад</button>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <form id="accessPointForm">
                    <div class="mb-3">
                        <label for="name" class="form-label">Название *</label>
                        <input type="text" class="form-control" id="name" name="name" required placeholder="Например: Прайс основной">
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Описание</label>
                        <textarea class="form-control" id="description" name="description" rows="2" placeholder="Краткое описание"></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Тип источника *</label>
                        <div class="source-type-toggle">
                            <label class="radio-label">
                                <input type="radio" name="sourceType" value="local" checked onchange="toggleSourceType()">
                                <span><i class="bi bi-folder2-open"></i> Локальная папка</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="sourceType" value="ftp" onchange="toggleSourceType()">
                                <span><i class="bi bi-globe2"></i> FTP-сервер</span>
                            </label>
                        </div>
                    </div>

                    <div id="localSourceBlock">
                        <div class="mb-3">
                            <label for="sourceFilePath" class="form-label">Путь к папке с файлами *</label>
                            <input type="text" class="form-control" id="sourceFilePath" name="sourceFilePath" placeholder="C:\PriceFiles\Supplier1\">
                            <div class="form-text">Локальная папка, из которой система забирает файлы прайсов.</div>
                        </div>
                    </div>

                    <div id="ftpSourceBlock" style="display:none">
                        <div class="row g-3">
                            <div class="col-md-9">
                                <label for="ftpHost" class="form-label">FTP-хост *</label>
                                <input type="text" class="form-control" id="ftpHost" name="ftpHost" placeholder="ftp.example.com">
                            </div>
                            <div class="col-md-3">
                                <label for="ftpPort" class="form-label">Порт</label>
                                <input type="number" class="form-control" id="ftpPort" name="ftpPort" value="21" min="1" max="65535">
                            </div>
                        </div>
                        <div class="row g-3 mt-0">
                            <div class="col-md-6">
                                <label for="ftpUser" class="form-label">Логин</label>
                                <input type="text" class="form-control" id="ftpUser" name="ftpUser" placeholder="user">
                            </div>
                            <div class="col-md-6">
                                <label for="ftpPassword" class="form-label">Пароль</label>
                                <input type="password" class="form-control" id="ftpPassword" name="ftpPassword" placeholder="••••••">
                            </div>
                        </div>
                        <div class="mb-3 mt-3">
                            <label for="ftpRemotePath" class="form-label">Путь на FTP</label>
                            <input type="text" class="form-control" id="ftpRemotePath" name="ftpRemotePath" placeholder="/prices/">
                            <div class="form-text">Удалённая папка на FTP, откуда забирать файлы прайсов</div>
                        </div>
                    </div>

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="isActive" name="isActive" checked>
                        <label class="form-check-label" for="isActive">Активна</label>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success"><i class="bi bi-check-lg"></i> Сохранить</button>
                        <button type="button" class="btn btn-outline-secondary" onclick="location.href='access-points.html'">Отмена</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../vendor/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/access-point-edit.js"></script>
</body>
</html>
