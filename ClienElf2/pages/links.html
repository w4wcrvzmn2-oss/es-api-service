<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сопоставление товаров - PharmData</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%232b6cab'/><rect x='42' y='22' width='16' height='56' rx='5' fill='%23fff'/><rect x='22' y='42' width='56' height='16' rx='5' fill='%23fff'/></svg>">
    <link href="../vendor/bootstrap.min.css" rel="stylesheet">
    <link href="../vendor/simple-datatables.css" rel="stylesheet">
    <link href="../vendor/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/custom.css">
</head>
<body class="bg-light">
    <script src="../js/auth.js"></script>
    <script>if (!AuthManager.isAuthenticated()) window.location.href = '../login.html';</script>
    <script src="../js/nav-component.js"></script>

    <div class="container-fluid py-4 px-3 px-lg-5">
        <h1 class="mb-4"><i class="bi bi-link-45deg"></i> Сопоставление прайсов</h1>

        <!-- Фильтр поставщика -->
        <div class="card shadow-sm mb-3">
            <div class="card-body py-2">
                <div class="row g-3 align-items-center">
                    <div class="col-auto">
                        <label for="filterSupplier" class="form-label mb-0">Поставщик</label>
                    </div>
                    <div class="col-auto">
                        <select id="filterSupplier" class="form-select form-select-sm" style="min-width:280px"><option value="">Выберите поставщика</option></select>
                    </div>
                    <div class="col-auto">
                        <button id="refreshBtn" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-clockwise"></i> Обновить</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Статистика -->
        <div class="row g-3 mb-3">
            <div class="col-md-4">
                <div class="card text-center border shadow-sm">
                    <div class="card-body py-3">
                        <div class="stat-label">Сопоставлено</div>
                        <div class="stat-value text-success" id="matchedCount">-</div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center border shadow-sm">
                    <div class="card-body py-3">
                        <div class="stat-label">Не сопоставлено</div>
                        <div class="stat-value text-danger" id="unmatchedCount">-</div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center border shadow-sm">
                    <div class="card-body py-3">
                        <div class="stat-label">Всего в БД</div>
                        <div class="stat-value" id="totalCount">-</div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Фильтр + инфо -->
        <div class="card shadow-sm mb-3">
            <div class="card-body py-2">
                <div class="d-flex flex-wrap align-items-center gap-3">
                    <span class="text-muted small"><i class="bi bi-funnel"></i> Фильтр:</span>
                    <div class="btn-group btn-group-sm" role="group">
                        <input type="radio" class="btn-check" name="filterMatch" id="filterAll" value="all" checked>
                        <label class="btn btn-outline-secondary" for="filterAll">Все</label>
                        <input type="radio" class="btn-check" name="filterMatch" id="filterMatched" value="matched">
                        <label class="btn btn-outline-success" for="filterMatched">Сопоставленные</label>
                        <input type="radio" class="btn-check" name="filterMatch" id="filterUnmatched" value="unmatched">
                        <label class="btn btn-outline-danger" for="filterUnmatched">Не сопоставленные</label>
                    </div>
                    <span class="text-muted small ms-auto" id="pricesInfo"></span>
                </div>
            </div>
        </div>

        <!-- Таблица -->
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table id="tblLinks" class="table table-hover table-striped align-middle mb-0">
                        <thead>
                            <tr>
                                <th style="width:22%" data-sort-key="supplier_item_name" class="sortable">Товар поставщика</th>
                                <th style="width:8%" data-sort-key="supplier_item_code" class="sortable">Код</th>
                                <th style="width:10%" data-sort-key="barcode" class="sortable">Штрихкод</th>
                                <th style="width:7%" data-sort-key="price" class="sortable">Цена</th>
                                <th style="width:11%" data-sort-key="status" class="sortable">Статус</th>
                                <th style="width:22%" data-sort-key="drug_name" class="sortable">Препарат из справочника</th>
                                <th style="width:10%" data-sort-key="match_method" class="sortable">Метод</th>
                                <th style="width:10%" data-no-filter>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="pricesTableBody">
                            <tr><td colspan="8" class="loading">Выберите поставщика для просмотра прайсов</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Модалка сопоставления (Bootstrap) -->
    <div class="modal fade" id="matchModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Редактирование сопоставления</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="info-section">
                        <h6 class="text-muted">Товар поставщика:</h6>
                        <div id="modalSupplierItem" class="info-box"></div>
                    </div>
                    <div class="info-section" id="currentMatchInfo" style="display:none">
                        <h6 class="text-muted">Текущее сопоставление:</h6>
                        <div id="currentMatchDetails" class="info-box success"></div>
                    </div>
                    <div class="mb-3">
                        <label for="modalDrugSearch" class="form-label">Поиск препарата в справочнике:</label>
                        <div class="input-group">
                            <input type="text" id="modalDrugSearch" class="form-control" placeholder="Название, МНН или штрихкод">
                            <button id="searchDrugBtn" class="btn btn-primary"><i class="bi bi-search"></i> Поиск</button>
                        </div>
                    </div>
                    <div id="drugSearchResults" style="display:none;max-height:300px;overflow-y:auto;border:1px solid #dee2e6;border-radius:.375rem">
                        <div id="drugSearchResultsList"></div>
                    </div>
                    <div class="row g-3 mt-1">
                        <div class="col-md-6">
                            <label for="modalMatchMethod" class="form-label">Метод сопоставления</label>
                            <select id="modalMatchMethod" class="form-select">
                                <option value="BARCODE">По штрихкоду</option>
                                <option value="CODE">По коду</option>
                                <option value="NAME">По наименованию</option>
                                <option value="MANUAL" selected>Ручное</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="modalMatchConfidence" class="form-label">Уверенность (%)</label>
                            <input type="number" id="modalMatchConfidence" class="form-control" min="0" max="100" step="0.1" value="100">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="saveMatchBtn" class="btn btn-success"><i class="bi bi-check-lg"></i> Сохранить</button>
                    <button id="clearMatchBtn" class="btn btn-warning"><i class="bi bi-trash"></i> Очистить</button>
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../vendor/bootstrap.bundle.min.js"></script>
    <script src="../vendor/simple-datatables.js"></script>
    <script src="../js/elf-table.js?v=2"></script>
    <script src="../js/api.js?v=2"></script>
    <script src="../js/toast.js?v=2"></script>
    <script src="../js/table-filters.js?v=6"></script>
    <script src="../js/links.js?v=13"></script>
</body>
</html>
