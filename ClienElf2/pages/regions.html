<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регионы - PharmData</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%232b6cab'/><rect x='42' y='22' width='16' height='56' rx='5' fill='%23fff'/><rect x='22' y='42' width='56' height='16' rx='5' fill='%23fff'/></svg>">
    <link href="../vendor/bootstrap.min.css" rel="stylesheet">
    <link href="../vendor/simple-datatables.css" rel="stylesheet">
    <link href="../vendor/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/custom.css">
</head>
<body class="bg-light">
    <script src="../js/auth.js"></script>
    <script>if (!AuthManager.isAuthenticated()) window.location.href = '../login.html';</script>
    <script src="../js/nav-component.js"></script>

    <div class="container-fluid py-4 px-3 px-lg-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="mb-0">Регионы</h1>
                <span class="text-muted fs-6">Справочник регионов</span>
            </div>
            <button class="btn btn-success" id="btnAddRegion"><i class="bi bi-plus-lg"></i> Добавить</button>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table id="tblRegions" class="table table-hover table-striped align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Код</th>
                                <th>Название</th>
                                <th>Столица</th>
                                <th>Фед. округ</th>
                                <th style="width:60px" data-no-filter>Акт.</th>
                                <th style="width:120px" data-no-filter>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="regionsTable">
                            <tr><td colspan="6" class="loading">Загрузка данных...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Модалка создания / редактирования -->
    <div class="modal fade" id="regionEditModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="regionEditTitle">Новый регион</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="regionForm">
                        <input type="hidden" id="editRegionId" value="">
                        <div class="mb-3">
                            <label class="form-label">Код <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="editCode" required maxlength="32" placeholder="например 77">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Название <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="editName" required maxlength="200" placeholder="Москва">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Столица</label>
                            <input type="text" class="form-control" id="editCapital" maxlength="200" placeholder="Москва">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Федеральный округ</label>
                            <input type="text" class="form-control" id="editDistrict" maxlength="200" placeholder="Центральный">
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="editActive" checked>
                            <label class="form-check-label" for="editActive">Активен</label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" id="btnSaveRegion">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../vendor/bootstrap.bundle.min.js"></script>
    <script src="../vendor/simple-datatables.js"></script>
    <script src="../js/elf-table.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/table-filters.js?v=6"></script>
    <script src="../js/regions.js?v=2"></script>
</body>
</html>
