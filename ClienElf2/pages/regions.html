<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регионы - ЭльФиСА</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💊</text></svg>">
    <link href="../vendor/bootstrap.min.css" rel="stylesheet">
    <link href="../vendor/simple-datatables.css" rel="stylesheet">
    <link href="../vendor/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/custom.css">
</head>
<body class="bg-light">
    <script src="../js/auth.js"></script>
    <script>if (!AuthManager.isAuthenticated()) window.location.href = '../login.html';</script>
    <script src="../js/nav-component.js"></script>

    <div class="container-fluid py-4 px-3 px-lg-5">
        <div class="d-flex align-items-center gap-3 mb-4">
            <h1 class="mb-0">Регионы</h1>
            <span class="text-muted fs-6">Справочник (только для чтения)</span>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table id="tblRegions" class="table table-hover table-striped align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Код</th>
                                <th>Название</th>
                                <th>Столица</th>
                                <th style="width:100px" data-no-filter>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="regionsTable">
                            <tr><td colspan="4" class="loading">Загрузка данных...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Модалка просмотра региона (Bootstrap Modal) -->
    <div class="modal fade" id="regionModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Информация о регионе</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="info-grid">
                        <div class="info-item"><label>Код:</label><span id="modalCode">-</span></div>
                        <div class="info-item"><label>Название:</label><span id="modalName">-</span></div>
                        <div class="info-item"><label>Столица:</label><span id="modalCapital">-</span></div>
                        <div class="info-item"><label>Фед. округ:</label><span id="modalDistrict">-</span></div>
                        <div class="info-item"><label>Статус:</label><span id="modalStatus">-</span></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../vendor/bootstrap.bundle.min.js"></script>
    <script src="../vendor/simple-datatables.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="../js/elf-table.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/table-filters.js?v=6"></script>
    <script src="../js/regions.js"></script>
</body>
</html>
