<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование поставщика - PharmData</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%232b6cab'/><rect x='42' y='22' width='16' height='56' rx='5' fill='%23fff'/><rect x='22' y='42' width='56' height='16' rx='5' fill='%23fff'/></svg>">
    <link href="../vendor/bootstrap.min.css" rel="stylesheet">
    <link href="../vendor/simple-datatables.css" rel="stylesheet">
    <link href="../vendor/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/custom.css">
</head>
<body class="bg-light">
    <script src="../js/auth.js"></script>
    <script>if (!AuthManager.isAuthenticated()) window.location.href = '../login.html';</script>
    <script src="../js/nav-component.js"></script>

    <div class="container-fluid py-4 px-3 px-lg-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="mb-0" id="pageTitle">Создание поставщика</h1>
            <button class="btn btn-outline-secondary" onclick="location.href='suppliers.html'"><i class="bi bi-arrow-left"></i> Назад</button>
        </div>

        <!-- Основные данные -->
        <div class="card shadow-sm mb-4">
            <div class="card-header"><h5 class="mb-0">Поставщик</h5></div>
            <div class="card-body">
                <form id="supplierForm">
                    <div class="row g-3">
                        <div class="col-md-5">
                            <label for="name" class="form-label">Название *</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="col-md-3">
                            <label for="code" class="form-label">Код поставщика</label>
                            <input type="text" class="form-control" id="code" name="code" inputmode="numeric" pattern="[0-9]*" placeholder="напр. 0001" title="Только цифры">
                            <div class="form-text">Только цифры. Попадает в DBF-выгрузку заказов (колонка SUP_CODE).</div>
                        </div>
                        <div class="col-md-4">
                            <label for="inn" class="form-label">ИНН</label>
                            <input type="text" class="form-control" id="inn" name="inn">
                        </div>
                    </div>
                    <div class="mb-3 mt-3">
                        <label for="contacts" class="form-label">Контакты</label>
                        <textarea class="form-control" id="contacts" name="contacts" rows="2" placeholder="Телефон, email"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="address" class="form-label">Адрес</label>
                        <textarea class="form-control" id="address" name="address" rows="2"></textarea>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label for="contractNumber" class="form-label">Номер договора</label>
                            <input type="text" class="form-control" id="contractNumber" name="contract_number" placeholder="Д-2026/001">
                        </div>
                        <div class="col-md-4">
                            <label for="login" class="form-label">Логин</label>
                            <input type="text" class="form-control" id="login" name="login" autocomplete="off">
                        </div>
                        <div class="col-md-4">
                            <label for="password" class="form-label">Пароль</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="password" name="password" autocomplete="new-password">
                                <button class="btn btn-outline-secondary" type="button" id="togglePassword" title="Показать/скрыть пароль">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Регионы <button type="button" class="btn btn-sm btn-primary ms-2" onclick="selectAllRegions()">Выбрать ВСЕ</button></label>
                        <div id="regionsCheckboxes" class="checkbox-grid"></div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success"><i class="bi bi-check-lg"></i> Сохранить</button>
                        <button type="button" class="btn btn-outline-secondary" onclick="location.href='suppliers.html'">Отмена</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Прайсы поставщика -->
        <div class="card shadow-sm mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Прайсы поставщика</h5>
                <button class="btn btn-primary btn-sm" onclick="addPriceList()"><i class="bi bi-plus-lg"></i> Добавить прайс</button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle mb-0">
                        <thead><tr><th>Название</th><th>Регион</th><th>Дата обновления</th><th>Статус</th><th>Действия</th></tr></thead>
                        <tbody id="priceListsTable"><tr><td colspan="5" class="empty-row">Загрузка...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Заказы -->
        <div class="card shadow-sm mb-4">
            <div class="card-header"><h5 class="mb-0">Заказы</h5></div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle mb-0">
                        <thead><tr><th>№ Заказа</th><th>Дата</th><th>Покупатель</th><th>Сумма</th><th>Статус</th></tr></thead>
                        <tbody id="ordersTable"><tr><td colspan="5" class="empty-row">Нет заказов</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Накладные -->
        <div class="card shadow-sm">
            <div class="card-header"><h5 class="mb-0">Накладные</h5></div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle mb-0">
                        <thead><tr><th>№ Накладной</th><th>Дата</th><th>Заказ</th><th>Сумма</th><th>Действия</th></tr></thead>
                        <tbody id="invoicesTable"><tr><td colspan="5" class="empty-row">Нет накладных</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="../vendor/bootstrap.bundle.min.js"></script>
    <script src="../vendor/simple-datatables.js"></script>
    <script src="../js/elf-table.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/supplier-edit.js"></script>
</body>
</html>
