<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная - ЭльФиСА</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💊</text></svg>">
    <link href="vendor/bootstrap.min.css" rel="stylesheet">
    <link href="vendor/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-light">
    <script src="js/auth.js"></script>
    <script>if (!AuthManager.isAuthenticated()) window.location.href = 'login.html';</script>
    <script src="js/nav-component.js"></script>

    <div class="container-fluid py-4 px-3 px-lg-5">
        <h1 class="mb-4">Главное меню</h1>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title mb-3">Статистика сопоставления</h5>
                <div class="row g-3">
                    <div class="col-sm-6">
                        <div class="card text-center border">
                            <div class="card-body py-3">
                                <div class="stat-label">Сопоставлено товаров</div>
                                <div class="stat-value text-success" id="unlinkedProducts">-</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="card text-center border">
                            <div class="card-body py-3">
                                <div class="stat-label">Не сопоставлено</div>
                                <div class="stat-value text-danger" id="unlinkedCount">-</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title mb-3"><i class="bi bi-lightning-charge"></i> Быстрые действия</h5>
                <div class="row g-2">
                    <div class="col-6 col-md-4 col-lg-3"><a href="pages/regions.html" class="btn btn-primary w-100"><i class="bi bi-geo-alt"></i> Регионы</a></div>
                    <div class="col-6 col-md-4 col-lg-3"><a href="pages/access-points.html" class="btn btn-primary w-100"><i class="bi bi-plug"></i> Точки доступа</a></div>
                    <div class="col-6 col-md-4 col-lg-3"><a href="pages/suppliers.html" class="btn btn-primary w-100"><i class="bi bi-building"></i> Поставщики</a></div>
                    <div class="col-6 col-md-4 col-lg-3"><a href="pages/price-lists.html" class="btn btn-primary w-100"><i class="bi bi-list-check"></i> Прайсы</a></div>
                    <div class="col-6 col-md-4 col-lg-3"><a href="pages/orders.html" class="btn btn-primary w-100"><i class="bi bi-cart3"></i> Заказы</a></div>
                    <div class="col-6 col-md-4 col-lg-3"><a href="pages/links.html" class="btn btn-primary w-100"><i class="bi bi-link-45deg"></i> Связки</a></div>
                    <div class="col-6 col-md-4 col-lg-3"><a href="pages/buyers.html" class="btn btn-primary w-100"><i class="bi bi-people"></i> Покупатели</a></div>
                </div>
            </div>
        </div>
    </div>

    <script src="vendor/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
