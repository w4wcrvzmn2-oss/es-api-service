<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка API - ES API Service</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <script src="auth.js"></script>
    <script src="toast.js"></script>
    <script src="navigation.js"></script>
    <script>
        if (!AuthManager.isAuthenticated()) {
            window.location.href = 'login.html';
        }
    </script>

    <div class="dashboard">

        <main class="main-content">
            <div class="page-header">
                <h1>🔍 Проверка API</h1>
                <p>Тестирование и проверка работы API endpoints</p>
            </div>

            <div class="content-wrapper">
            <!-- Проверка состояния сервиса -->
            <div class="auth-panel">
                <h2>Мониторинг сервиса</h2>
                <button id="healthCheckBtn" class="btn btn-info">Проверить состояние сервиса</button>
                <div id="healthStatus" class="status"></div>
            </div>

            <!-- Запрос данных -->
            <div class="data-panel">
                <h2>Запрос данных из таблиц</h2>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="tableInput">Таблица:</label>
                        <input type="text" id="tableInput" placeholder="Region, es_ef2, es_country" value="" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="limit">Лимит записей:</label>
                        <input type="number" id="limit" value="100" min="1" max="100000">
                    </div>
                    <div class="form-group">
                        <label for="offset">Смещение:</label>
                        <input type="number" id="offset" value="0" min="0">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="updatedAfter">Обновлено после (RFC3339):</label>
                        <input type="datetime-local" id="updatedAfter">
                        <button type="button" class="btn btn-secondary" onclick="setCurrentDateTime()" style="margin-top: 5px;">Сейчас</button>
                    </div>
                    <div class="form-group">
                        <label for="idGt">ID больше чем:</label>
                        <input type="number" id="idGt" placeholder="Оставьте пустым для отключения">
                    </div>
                </div>

                <div class="form-group">
                    <label for="columns">Колонки (через запятую):</label>
                    <input type="text" id="columns" placeholder="Code,Name,Capital (оставьте пустым для всех)">
                </div>

                <div class="button-group">
                    <button id="fetchDataBtn" class="btn btn-primary">Получить данные</button>
                    <button id="clearDataBtn" class="btn btn-secondary">Очистить результаты</button>
                    <button id="exportJsonBtn" class="btn btn-success" style="display: none;">Экспорт JSON</button>
                </div>

                <div id="requestInfo" class="request-info"></div>
            </div>

            <!-- Результаты -->
            <div class="results-panel">
                <h2>Результаты</h2>
                <div id="loadingIndicator" class="loading" style="display: none;">
                    <div class="spinner"></div>
                    <span>Загрузка данных...</span>
                </div>
                <!-- Toast контейнер для уведомлений -->
                <div id="toastContainer"></div>
                <div id="dataContainer" class="data-container">
                    <pre id="jsonData"></pre>
                </div>
            </div>
            </div>
        </main>
    </div>

    <script src="api-test.js"></script>
    <style>
        .page-header {
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid #3498db;
        }
        .page-header h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .page-header p {
            color: #7f8c8d;
            font-size: 1.1em;
        }
        .content-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .logout-btn {
            width: 100%;
            margin-top: 20px;
        }
    </style>
</body>
</html>
