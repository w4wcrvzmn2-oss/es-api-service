<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аудит-логи - ES API Service</title>
    <link rel="stylesheet" href="styles.css">
    <script src="auth.js"></script>
    <script src="toast.js"></script>
    <script src="loading.js"></script>
</head>
<body>
    <div class="dashboard">
        <script src="navigation.js"></script>
        
        <main class="main-content">
            <div class="section">
                <h1><span class="page-icon">📋</span> Аудит-логи</h1>
                
                <!-- Фильтры -->
                <div class="card" style="margin-bottom: 6px;">
                    <h3>Фильтры</h3>
                    <div class="form-row" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;">
                        <div class="form-group">
                            <label for="filterUserID">Пользователь:</label>
                            <input type="text" id="filterUserID" placeholder="ID или имя" style="width: 100%; padding: 8px;">
                        </div>
                        <div class="form-group">
                            <label for="filterLogLevel">Уровень:</label>
                            <select id="filterLogLevel" style="width: 100%; padding: 8px;">
                                <option value="">Все</option>
                                <option value="DEBUG">DEBUG</option>
                                <option value="INFO">INFO</option>
                                <option value="WARN">WARN</option>
                                <option value="ERROR">ERROR</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="filterCategory">Категория:</label>
                            <input type="text" id="filterCategory" placeholder="Например: PRICE_LIST" style="width: 100%; padding: 8px;">
                        </div>
                        <div class="form-group">
                            <label for="filterAction">Действие:</label>
                            <input type="text" id="filterAction" placeholder="Например: CREATE" style="width: 100%; padding: 8px;">
                        </div>
                        <div class="form-group">
                            <label for="filterStartDate">С даты:</label>
                            <input type="datetime-local" id="filterStartDate" style="width: 100%; padding: 8px;">
                        </div>
                        <div class="form-group">
                            <label for="filterEndDate">По дату:</label>
                            <input type="datetime-local" id="filterEndDate" style="width: 100%; padding: 8px;">
                        </div>
                    </div>
                    <div class="button-group" style="margin-top: 15px;">
                        <button id="applyFiltersBtn" class="btn btn-primary">Применить фильтры</button>
                        <button id="clearFiltersBtn" class="btn btn-secondary">Очистить</button>
                        <button id="refreshBtn" class="btn btn-info">🔄 Обновить</button>
                    </div>
                </div>
                
                <!-- Статистика -->
                <div id="statsSection" class="card" style="margin-bottom: 6px; display: none;">
                    <h3>Статистика (последние 7 дней)</h3>
                    <div id="statsContent"></div>
                </div>
                
                <!-- Таблица логов -->
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <h3 style="margin: 0;">Логи</h3>
                        <div id="logsPagination" style="display: flex; gap: 10px; align-items: center;">
                            <span id="logsInfo"></span>
                            <button id="prevPageBtn" class="btn btn-secondary" disabled>← Назад</button>
                            <button id="nextPageBtn" class="btn btn-secondary" disabled>Вперёд →</button>
                        </div>
                    </div>
                    <div id="logsTableContainer" class="table-container" style="overflow-x: auto; overflow-y: visible; -webkit-overflow-scrolling: touch; width: 100%; max-width: 100%;">
                        <table id="logsTable" class="data-table" style="width: 100%; min-width: 1400px; border-collapse: collapse;">
                            <thead>
                                <tr style="background: #f0f0f0;">
                                    <th style="padding: 10px; text-align: left; border: 1px solid #ddd;">Дата/Время</th>
                                    <th style="padding: 10px; text-align: left; border: 1px solid #ddd;">Уровень</th>
                                    <th style="padding: 10px; text-align: left; border: 1px solid #ddd;">Пользователь</th>
                                    <th style="padding: 10px; text-align: left; border: 1px solid #ddd;">Категория</th>
                                    <th style="padding: 10px; text-align: left; border: 1px solid #ddd;">Действие</th>
                                    <th style="padding: 10px; text-align: left; border: 1px solid #ddd;">Сообщение</th>
                                    <th style="padding: 10px; text-align: left; border: 1px solid #ddd;">IP</th>
                                    <th style="padding: 10px; text-align: left; border: 1px solid #ddd;">Метод</th>
                                    <th style="padding: 10px; text-align: left; border: 1px solid #ddd;">Путь</th>
                                    <th style="padding: 10px; text-align: left; border: 1px solid #ddd;">Статус</th>
                                    <th style="padding: 10px; text-align: left; border: 1px solid #ddd;">Время (мс)</th>
                                </tr>
                            </thead>
                            <tbody id="logsTableBody">
                                <tr>
                                    <td colspan="11" style="padding: 20px; text-align: center; color: #666;">
                                        Загрузка...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <div id="toastContainer"></div>
    
    <script src="audit-logs.js"></script>
</body>
</html>
