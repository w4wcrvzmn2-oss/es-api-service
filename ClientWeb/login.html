<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Электронная Фармация</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234b52c4'/><rect x='42' y='22' width='16' height='56' rx='5' fill='%23fff'/><rect x='22' y='42' width='56' height='16' rx='5' fill='%23fff'/></svg>">
    <link rel="stylesheet" href="ef-design.css">
    <style>
        .login-screen {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 48px 24px; min-height: 100vh; box-sizing: border-box;
            background: linear-gradient(180deg, #f4f5f7 0%, #eceef2 100%);
        }
        .login-col { width: 400px; max-width: 100%; }
        .login-brand { display: flex; align-items: center; gap: 11px; justify-content: center; margin-bottom: 22px; }
        .login-brand .ef-logo { width: 34px; height: 34px; border-radius: 9px; }
        .login-brand .ef-logo::before { left: 14.5px; top: 7px; width: 5px; height: 20px; }
        .login-brand .ef-logo::after  { left: 7px; top: 14.5px; width: 20px; height: 5px; }
        .login-title { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
        .login-sub   { font-size: 12px; color: var(--ef-muted); }
        .login-card  { background: #fff; border: 1px solid var(--ef-border); border-radius: 12px;
                       box-shadow: 0 4px 12px rgba(16,24,40,.06); padding: 26px 26px 22px; }
        #loginError {
            display: none; background: var(--ef-danger-bg); color: var(--ef-danger);
            border: 1px solid #f2c9c7; border-radius: var(--ef-r-field); padding: 10px 12px;
            font-size: 12.5px; line-height: 1.5; margin-bottom: 14px; white-space: pre-line; word-wrap: break-word;
        }
        #protocolWarning {
            display: none; background: var(--ef-warning-bg); color: var(--ef-warning);
            border: 1px solid #f0dca6; border-radius: var(--ef-r-field);
            padding: 10px 12px; font-size: 12.5px; margin-bottom: 14px;
        }
        .login-field { margin-bottom: 14px; }
        .login-hint { display: flex; flex-direction: column; gap: 6px; }
    </style>
</head>
<body class="ef role-admin">
    <div class="login-screen">
        <div class="login-col">

            <div class="login-brand">
                <div class="ef-logo"></div>
                <div>
                    <div class="login-title">Электронная Фармация</div>
                    <div class="login-sub">Оптовая фарм-дистрибуция</div>
                </div>
            </div>

            <div class="login-card">
                <div class="ef-h2" style="font-size:18px;margin-bottom:18px">Вход в систему</div>

                <div id="loginError"></div>
                <div id="protocolWarning">
                    <strong>⚠️ Внимание:</strong> Страница должна открываться через HTTP-сервер, а не через file://.
                </div>

                <form id="loginForm">
                    <div class="login-field">
                        <label class="ef-label" for="username">Логин или e-mail</label>
                        <input class="ef-input" type="text" id="username" required
                               autocomplete="username" placeholder="operator@apteka.ru">
                    </div>
                    <div class="login-field">
                        <label class="ef-label" for="password">Пароль</label>
                        <input class="ef-input" type="password" id="password" required
                               autocomplete="current-password" placeholder="••••••••">
                    </div>
                    <button type="submit" class="ef-btn ef-btn--primary ef-btn--block" style="margin-top:4px">
                        Войти
                    </button>
                </form>
            </div>

        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        // Проверяем, авторизован ли пользователь
        if (AuthManager.isAuthenticated()) {
            const role = AuthManager.getRole();
            if (role === 'manager') {
                window.location.href = 'manager/index.html';
            } else if (role === 'supplier') {
                window.location.href = '/supplier/index.html';
            } else {
                window.location.href = 'index.html';
            }
        }

        // Проверяем, что страница открыта через HTTP/HTTPS, а не file://
        if (window.location.protocol === 'file:') {
            const warningDiv = document.getElementById('protocolWarning');
            const errorDiv = document.getElementById('loginError');
            warningDiv.style.display = 'block';
            errorDiv.innerHTML = '❌ <strong>Ошибка протокола:</strong> Страница открыта через <code>file://</code> протокол.\n\n' +
                '<strong>Решение:</strong>\n' +
                '1. Убедитесь, что сервер запущен\n' +
                '2. Откройте в браузере: <a href="http://localhost:8080/login.html">http://localhost:8080/login.html</a>\n\n' +
                'Текущий адрес: <code>' + window.location.href + '</code>';
            errorDiv.style.display = 'block';
            document.getElementById('loginForm').style.opacity = '0.5';
            document.getElementById('loginForm').style.pointerEvents = 'none';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Проверяем протокол еще раз перед отправкой
            if (window.location.protocol === 'file:') {
                const errorDiv = document.getElementById('loginError');
                errorDiv.innerHTML = '❌ <strong>Ошибка:</strong> Страница открыта через file:// протокол.\n\nОткройте страницу через HTTP сервер: <strong>http://localhost:8080/login.html</strong>';
                errorDiv.style.display = 'block';
                return;
            }

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Автоматически определяем URL API из текущего адреса страницы
            let apiUrl = window.location.origin;

            // Если origin пустой или file://, используем localhost:8080 по умолчанию
            if (!apiUrl || apiUrl === 'null' || apiUrl.startsWith('file://')) {
                apiUrl = 'http://localhost:8080';
                console.warn('Используется URL по умолчанию:', apiUrl);
            }

            console.log('Определен URL API:', apiUrl);

            const errorDiv = document.getElementById('loginError');
            errorDiv.style.display = 'none';

            try {
                const result = await AuthManager.login(username, password, apiUrl);
                if (result.success && result.token) {
                    // Проверяем, что токен сохранен
                    const savedToken = AuthManager.getToken();
                    if (!savedToken || savedToken !== result.token) {
                        console.error('Токен не сохранился правильно');
                        errorDiv.textContent = 'Ошибка сохранения токена. Попробуйте еще раз.';
                        errorDiv.style.display = 'block';
                        return;
                    }
                    // Покупатели работают через десктоп-приложение, не через веб
                    if (result.role === 'buyer') {
                        localStorage.removeItem(AuthManager.STORAGE_TOKEN_KEY);
                        localStorage.removeItem(AuthManager.STORAGE_USER_INFO_KEY);
                        localStorage.removeItem('authToken');
                        localStorage.removeItem('userInfo');
                        errorDiv.textContent = 'Это учётная запись покупателя — вход через десктоп-приложение, не через сайт.';
                        errorDiv.style.display = 'block';
                        return;
                    }
                    // Сервер сам определил роль и вернул, куда вести:
                    // admin -> index.html, manager -> manager/index.html, supplier -> /supplier/index.html
                    const dest = result.redirectUrl || (result.role === 'manager' ? 'manager/index.html' : 'index.html');
                    console.log('Авторизация успешна, роль:', result.role, '-> переход:', dest);
                    window.location.href = dest;
                } else {
                    errorDiv.textContent = result.error || 'Ошибка авторизации';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                console.error('Ошибка при авторизации:', error);
                let errorMessage = error.message || 'Неизвестная ошибка';

                // Улучшаем сообщение об ошибке
                if (errorMessage.includes('Failed to fetch') ||
                    errorMessage.includes('NetworkError') ||
                    errorMessage.includes('ERR_CONNECTION_REFUSED')) {
                    errorMessage = `Не удалось подключиться к серверу ${apiUrl}\n\nВозможные причины:\n• Сервер не запущен\n• Неправильный адрес сервера\n• Проблемы с сетью\n\nУбедитесь, что сервер запущен и доступен.`;
                }

                // Заменяем переносы строк на HTML
                errorMessage = errorMessage.replace(/\n/g, '<br>');
                errorDiv.innerHTML = errorMessage;
                errorDiv.style.display = 'block';
                errorDiv.style.whiteSpace = 'pre-line';
            }
        });

        // Загружаем сохраненное имя пользователя
        const savedUsername = localStorage.getItem('es_api_username');
        if (savedUsername) {
            document.getElementById('username').value = savedUsername;
        }
    </script>
</body>
</html>
